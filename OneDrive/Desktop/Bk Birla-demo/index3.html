<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <h1>Forms in html</h1>
    <h1 style="font-size: 20x;">Forms in html</h1>
</head>
<body>
    <form>
        <label> First Name :</label>
        <input type="text" name="Name"placeholder="Enter your name">
        <br><br>
        <label> Last Name :</label>
        <input type="text" name="Name"placeholder="Enter your Last name">
        <br><br>
        
        <label>Age :</label>
        <input type="number" name="Age" placeholder="Enter your age">
        <br><br>
        <label>DOB:</label>
        <input type="date" name="DOB" >
        <br><br>
        <label>Email :</label>
        <input type="email" name="Email" placeholder="Enter your email">
        <br><br>
        <label>Password :</label>
        <input type="password" name="Password" placeholder="Enter your password">
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="Gender" value="Male"> Male  
          
        <input type="radio" name="Gender" value="Female"> Female
         
        <input type="radio" name="Gender" value="Others"> Trans
        <br><br>
        <label>Experience:</label>
        <input type="range" name="Experience" min="0" max="10">
        <br><br>
        <label> upload File :</label>
        <input type="file" name="File">
        <br><br>
        <label>Education :</label>
        <input type="checkbox" name="Education" value="10th" > 10th
        <input type="checkbox" name="Education" value="12th" > 12th
        <input type="checkbox" name="Education" value="Graduation" > Graduation
        <br><br>

        <label>State :</label>
        <select name="state 1">
            <option value="State 1">State 1</option>
          
        </select>

        <br><br>
        <label>Feedback : </label>
        <input type ="text area" name="Feedback">
        <br><br>

        <label> All the  details are correct ?</label>
        <input type="radio"> Yes
        <input type="radio"> No
        <br><br>
        <input type="submit">
        

           
    </form>
    
</body>
</html>
